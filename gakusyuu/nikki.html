<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ひとこと日記</title>
</head>

<body>
    <header>
        <nav>
            <a href="index.html">ホーム</a>
            <a href="notes.html">学習メモ</a>
            <a href="omikuji.html">おみくじ</a>
            <a href="todo.html">Todo</a>
        </nav>
    </header>


    <h1>ひとこと日記</h1>
    <p>理論上は日記を書いて保存できるはず</p>


    <!--日記入力欄-->
    <input id="diary" type="text" placeholder="日記の内容を入力">
    <!--ボタン-->
    <button id="touroku">内容登録</button>

    <!--日記の本文-->
    <ul id="honbun"></ul>



    <script>

        /*idとってくる*/
        const diary = document.getElementById('diary')
        const tourokuBtn = document.getElementById('touroku')
        const honbun = document.getElementById('honbun')

        /*あぺんどだいありーって関数つくった*/
        function appenddiary(text) {

            const li = document.createElement('li')




            /*ここに日付勝手に読み込んでだしてくれるのいれたい*/
            const today = new Date();

            const hizuke =
                today.getFullYear() + '年' +
                (today.getMonth() + 1) + '月' +
                today.getDate() + '日';

            const div = document.createElement('div')
            div.textContent = hizuke;




            /*spanで定数はspan要素をつくる*/
            const span = document.createElement('span')
            /*spanの中にテキストコメントでtextの中身をいれる*/
            span.textContent = text;

            /*delで定数はbutton要素をつくる*/
            const del = document.createElement('button')
            /*delの中にテキストコメントで削除をいれる*/
            del.textContent = '削除';
            /*delがクリックされたとき*/
            del.addEventListener('click', () => {
                /*spanを消す*/
                li.remove();
                /*その状態を保存*/
                save();

            });


            span.appendChild(div)

            /*<li>
                <span>日記内容<span>
                    <li>*/
            li.appendChild(span)
            /*<li>
                <span>日記内容<span>
                    <button>削除<button>
                        <li>*/
            li.appendChild(del)
            /*<ul>
                <li>
                    <span>日記内容<span>
                        <button>削除<button>
                            <li>
                                <ul>*/
            honbun.appendChild(li)


        }



        /*saveって関数つくった*/
        function save() {
            /*diarysって名前の何にもはいってない配列つくった*/
            const diarys = [];

            /*配列に追加*/
            /*honbunのなかのliをいっこずつ確認
            ここ自信なし*/
            for (const li of honbun.children) {
                /*liのなかのspanをさがす*/
                const span = li.querySelector('span')
                /*配列に追加*/
                diarys.push(span.textContent);
            }
            localStorage.setItem('nikkinaiyou', JSON.stringify(diarys));
        }



        tourokuBtn.addEventListener('click', () => {
            const nikki = diary.value;
            /*もしdiaryの中身が空だったら*/
            if (nikki === '') return;
            /*この関数を実行！*/
            appenddiary(nikki);
            /*この関数を実行！*/
            save();
            /*最後に入力欄を空に*/
            diary.value = '';
        });


        /*日記読み込み*/
        const saved = localStorage.getItem('nikkinaiyou')
        if (saved) {
            /*JSON.parse(saved);は文字列を配列に戻す*/
            const diarys = JSON.parse(saved);
            for (const text of diarys) {
                /*この関数を実行してる*/
                appenddiary(text);
            }

        }



    </script>


</body>

</html>
